# nginx for PhotoCraft's authenticated MCP bridge. mcp-proxy listens only on
# loopback:8083; this server is the only process exposed on 8082.
worker_processes 1;
pid /tmp/photocraft-mcp-nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    map_hash_bucket_size 128;
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_authorization $mcp_authorized {
        default 0;
        "Bearer __MCP_TOKEN__" 1;
    }

    server {
        listen 8082;
        listen [::]:8082;

        location / {
            if ($mcp_authorized = 0) { return 401; }

            proxy_pass http://127.0.0.1:8083;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }
    }
}
