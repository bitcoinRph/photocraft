# nginx for the StartOS package: the browser editor on 8080 (as upstream's
# packaging/web/nginx.conf serves it) and the workspace file exchange on 8081.
# StartOS terminates TLS and checks credentials in front of 8081
# (startos/interfaces.ts), so this file does neither.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    # All runtime writes go to /tmp, allowing a read-only container filesystem.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Precompressed at build time; uncompressed clients receive the original.
    gzip_static on;
    gzip_vary on;

    # The editor: a static site that runs in the browser.
    server {
        listen 8080;
        listen [::]:8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /index.html {
            add_header Cache-Control no-cache always;
            add_header X-Content-Type-Options nosniff always;
        }

        # Trunk gives these files content hashes. Missing assets must be 404s,
        # never an HTML fallback or an error cached for a year.
        location ~ \.(wasm|js)$ {
            types { application/wasm wasm; text/javascript js; }
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }

    # The file exchange: the workspace that photocraft-cli reads and writes.
    # GET downloads, a directory URL lists, PUT uploads, DELETE removes,
    # MKCOL creates a directory. /.json/<dir>/ lists a directory as JSON.
    server {
        listen 8081;
        listen [::]:8081;
        root /data/workspace;
        add_header X-Content-Type-Options nosniff always;

        # Uploads are large (PSD, TIFF, RAW).
        client_max_body_size 4g;
        # nginx writes an upload here and then renames it into place, which
        # only works on the same filesystem as the workspace.
        client_body_temp_path /data/nginx-tmp;

        location / {
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
            dav_methods PUT DELETE MKCOL COPY MOVE;
            create_full_put_path on;
            dav_access user:rw group:rw all:r;
        }

        location /.json/ {
            alias /data/workspace/;
            autoindex on;
            autoindex_format json;
        }
    }
}
